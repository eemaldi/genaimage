[server]
host = "127.0.0.1"
port = 3000
# Maximum multipart body size for the uploads API (32 MiB).
max_upload_bytes = 33554432

[comfyui]
base_url = "http://127.0.0.1:8188"
request_timeout_seconds = 60
websocket_reconnect_seconds = 2
allowed_hosts = []

[llm]
# An empty URL keeps the LLM and assistant disabled. To enable a typical local
# Ollama OpenAI-compatible endpoint, set http://127.0.0.1:11434/v1.
base_url = ""
# api_key = "local-only-token" # Write-only in the settings API.
text_model = ""
vision_model = ""
allowed_hosts = []
connect_timeout_secs = 5
request_timeout_secs = 60
idle_timeout_secs = 30
# Optional reviewed capability overrides, keyed by the exact model ID:
# [llm.capabilities."model-id"]
# tools = true
# vision = false

[paths]
# Omitted data paths default under $XDG_DATA_HOME/genaimage (or ~/.local/share/genaimage).
# State and runs are scoped to the canonical workspace. Databases with runs
# are bound to their workspace and backend endpoint.
# state_database = "/absolute/path/state.sqlite3"
# runs = "/absolute/path/runs"
# uploads = "/absolute/path/uploads"
# Writable prompt template library, one <id>.toml per template; created on first write.
# templates = "/absolute/path/templates"
# Writable user workflow root; it may be missing. Workflow packs are read-only.
workflows = "workflows/comfyui"
# Each pack root is a directory of pack directories that contain pack.toml.
# Omitting this key uses ["workflows/packs"]; an empty list disables packs.
# packs = ["workflows/packs", "/absolute/path/more-packs"]
