id = "character-art"
version = "1.0.0"
description = "Guided character art: portrait, sketch-to-image, inpaint and turnaround workflows built from core ComfyUI nodes."
workflows = [
  "character-portrait/workflow.genaimage.json",
  "character-sketch-to-image/workflow.genaimage.json",
  "character-inpaint/workflow.genaimage.json",
  "character-turnaround/workflow.genaimage.json",
]
templates = ["templates/concept-art.toml", "templates/turnaround.toml"]
checkpoint_profiles = "checkpoints.toml"

[requires]
node_classes = [
  "CheckpointLoaderSimple",
  "CLIPTextEncode",
  "EmptyLatentImage",
  "ImageToMask",
  "KSampler",
  "LoadImage",
  "SaveImage",
  "VAEDecode",
  "VAEEncode",
  "VAEEncodeForInpaint",
]
