[workspace]
members = [
  "crates/genaimage",
  "crates/genaimage-api",
  "crates/genaimage-comfyui",
  "crates/genaimage-core",
  "crates/genaimage-llm",
  "crates/genaimage-server",
  "crates/genaimage-test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
eventsource-stream = "0.2"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
http-body-util = "0.1"
mime_guess = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2", features = ["serde"] }
utoipa = { version = "5", default-features = false, features = ["macros", "chrono"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "allow"

[profile.release]
strip = "symbols"
codegen-units = 1
