name: Epic
description: Track a roadmap outcome across related tasks.
title: "[Epic] "
labels:
  - epic
body:
  - type: input
    id: phase
    attributes:
      label: Phase
      description: Name the roadmap phase, for example Foundations.
      placeholder: Foundations
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Summarise the change this epic coordinates.
      placeholder: Describe the work this epic brings together.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the state of the repository when this epic is complete.
      placeholder: State the observable outcome.
    validations:
      required: true
  - type: textarea
    id: sub_issues_notes
    attributes:
      label: Sub-issues notes
      description: Explain how sub-issues and their dependencies will be tracked.
      placeholder: |
        Tracked as native sub-issues of this epic. Dependencies between them are recorded as "blocked by" relationships and in each issue body.
    validations:
      required: true
