name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js for the portal
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      # The runner builds the portal before Clippy and workspace tests.
      - name: Run repository checks
        run: python3 scripts/ci_check.py

  performance-budget:
    name: Performance budget (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js for the portal
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Build portal for the release binary and JavaScript measurement
        working-directory: apps/portal
        run: npm ci && npm run build

      - name: Run quick Criterion benchmarks
        run: cargo bench --locked -p genaimage-core --bench performance -- --quick
        continue-on-error: true

      - name: Measure performance budgets and verify summary
        run: |
          python3 scripts/perf_check.py --quick
          cat "$GITHUB_STEP_SUMMARY"
          grep -q '^## Performance budget' "$GITHUB_STEP_SUMMARY"
          grep -q '^## Benchmarks' "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

  container-image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: genaimage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        run: |
          size=$(docker image inspect genaimage:ci --format '{{.Size}}')
          echo "Image size: ${size} bytes"
          if [ "$size" -ge 60000000 ]; then
            echo "::error::Image is ${size} bytes; the limit is 60000000 bytes"
            exit 1
          fi

      - name: Start container and wait for health
        run: |
          docker run -d --name genaimage -p 127.0.0.1:8190:8190 genaimage:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect genaimage --format '{{.State.Health.Status}}')
            echo "Health: ${status}"
            test "$status" = healthy && exit 0
            sleep 2
          done
          docker logs genaimage
          exit 1

      - name: Check health endpoint from the host
        run: curl --fail --silent http://127.0.0.1:8190/api/v1/health

      - name: Show container diagnostics
        if: failure()
        run: |
          docker logs genaimage || true
          docker inspect genaimage --format '{{json .State.Health}}' || true
