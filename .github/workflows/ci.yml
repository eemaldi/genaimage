name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js for the portal
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      # The runner builds the portal before Clippy and workspace tests.
      - name: Run repository checks
        run: python3 scripts/ci_check.py

  performance-budget:
    name: Performance budget (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js for the portal
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - name: Build portal for the release binary and JavaScript measurement
        working-directory: apps/portal
        run: npm ci && npm run build

      - name: Run quick Criterion benchmarks
        run: cargo bench --locked -p genaimage-core --bench performance -- --quick
        continue-on-error: true

      - name: Measure performance budgets and verify summary
        run: |
          python3 scripts/perf_check.py --quick
          cat "$GITHUB_STEP_SUMMARY"
          grep -q '^## Performance budget' "$GITHUB_STEP_SUMMARY"
          grep -q '^## Benchmarks' "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
