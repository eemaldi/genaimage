[package]
name = "genaimage-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["portal"]
portal = ["dep:rust-embed"]

[dependencies]
axum = { workspace = true, features = ["query"] }
base64.workspace = true
futures-util.workspace = true
genaimage-api = { path = "../genaimage-api" }
genaimage-comfyui = { path = "../genaimage-comfyui" }
genaimage-core = { path = "../genaimage-core" }
genaimage-llm = { path = "../genaimage-llm" }
http-body-util.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
mime_guess.workspace = true
multer = "3"
percent-encoding = "2"
reqwest = { workspace = true, features = ["stream"] }
rust-embed = { version = "8", features = ["debug-embed"], optional = true }
url.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-axum = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
chrono.workspace = true
genaimage-api = { path = "../genaimage-api", features = ["client"] }
genaimage-test-support = { path = "../genaimage-test-support" }
image.workspace = true
hex.workspace = true
sha2.workspace = true
rusqlite.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process", "fs"] }
